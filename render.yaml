services:
  - type: web
    name: telegram-copier-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://vphckospghbeezvwpjwp.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_KzOiEouPTpCA9xx0mudKHw_kQMncouM
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        value: https://telegram-copier-web.onrender.com
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: METAAPI_PROVISIONING_TOKEN
        sync: false
      - key: META_API_URL
        value: https://mt-provisioning-api-v1.agiliumtrade.agiliumtrade.ai
      - key: AUTO_TRADING_RUNTIME_ENABLED
        value: "true"
      - key: BREAK_EVEN_SWEEP_INTERVAL_MS
        value: "5000"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: NGN
      # Fallback prices only: the active Pro/Premium prices are stored in the
      # admin_settings table and managed from Admin Panel -> Pricing & Plans, which
      # also re-syncs the matching Paystack Plan Code so renewals use the new amount.
      - key: PAYSTACK_PLAN_PRO_AMOUNT
        value: "250000"
      - key: PAYSTACK_PLAN_PREMIUM_AMOUNT
        value: "600000"
      - key: PAYSTACK_PLAN_INTERVAL
        value: monthly
  - type: web
    name: telegram-copier-web
    runtime: static
    plan: free
    branch: main
    autoDeployTrigger: commit
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://telegram-copier-api-l1mj.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://vphckospghbeezvwpjwp.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_KzOiEouPTpCA9xx0mudKHw_kQMncouM

services:
  - type: web
    name: telegram-copier-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        value: https://telegram-copier-web.onrender.com
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: META_API_URL
        value: https://mt-provisioning-api-v1.agiliumtrade.ai
  - type: web
    name: telegram-copier-web
    runtime: static
    plan: free
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://telegram-copier-api-l1mj.onrender.com

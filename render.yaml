services:
  - type: web
    name: telegram-copier-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    rootDir: server
    # `npm run typecheck` is in the build, not only in the test script: the deploy is the one moment a type
    # error can be stopped before it starts serving, and the blueprint is what makes it run with no CI to forget.
    buildCommand: npm ci && npm run typecheck && npm run typecheck:strict
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # `engines.node` is only a promise: npm warns and installs anyway (no `engine-strict` in this repo), so a
      # Render image on an older Node would have satisfied the manifest and still served the vulnerability. The
      # version Render installs is written here, and `server/test/typescript-enforcement.test.js` fails if this
      # line and the floor in the two package.json files ever disagree.
      - key: NODE_VERSION
        value: "22.23.4"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://vphckospghbeezvwpjwp.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_KzOiEouPTpCA9xx0mudKHw_kQMncouM
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        value: https://telegram-copier-web.onrender.com
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: METAAPI_PROVISIONING_TOKEN
        sync: false
      - key: META_API_URL
        value: https://mt-provisioning-api-v1.agiliumtrade.agiliumtrade.ai
      - key: AUTO_TRADING_RUNTIME_ENABLED
        value: "true"
      - key: BREAK_EVEN_SWEEP_INTERVAL_MS
        value: "5000"
      # Idle MetaAPI account cleanup: warn on day 25, delete on day 30. Accounts are
      # never slept or undeployed, only deleted once nobody is using them; paid
      # subscribers and accounts with open positions are skipped.
      - key: INACTIVITY_CLEANUP_ENABLED
        value: "true"
      - key: INACTIVITY_WARNING_DAYS
        value: "25"
      - key: INACTIVITY_DELETION_DAYS
        value: "30"
      # Flutterwave replaces Paystack. Keys and the webhook hash are secrets and stay
      # sync: false, so each environment (test/live) is set from its own dashboard.
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_PUBLIC_KEY
        sync: false
      - key: FLW_WEBHOOK_HASH
        sync: false
      - key: FLW_ENCRYPTION_KEY
        sync: false
      - key: FLW_CURRENCY
        value: NGN
      - key: FLW_PLAN_INTERVAL
        value: monthly
      # Fallback prices only, in the SMALLEST unit (hundredths): Flutterwave's API is
      # fed the main unit and that conversion lives in server/services/flutterwave.js.
      # The active Starter/Pro/Premium prices - in naira AND dollars - are stored in the
      # plans table and managed from Admin Panel -> Pricing & Plans, which re-syncs the
      # matching Flutterwave payment plan per currency so renewals use the new amount.
      # These defaults are priced against the per-account cost MetaAPI bills.
      - key: FLW_PLAN_STARTER_AMOUNT
        value: "6000000"
      - key: FLW_PLAN_PRO_AMOUNT
        value: "10500000"
      - key: FLW_PLAN_PREMIUM_AMOUNT
        value: "15000000"
      - key: FLW_PLAN_STARTER_USD_AMOUNT
        value: "3900"
      - key: FLW_PLAN_PRO_USD_AMOUNT
        value: "6900"
      - key: FLW_PLAN_PREMIUM_USD_AMOUNT
        value: "9900"
  - type: web
    name: telegram-copier-web
    runtime: static
    plan: free
    branch: main
    autoDeployTrigger: commit
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://telegram-copier-api-l1mj.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://vphckospghbeezvwpjwp.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_KzOiEouPTpCA9xx0mudKHw_kQMncouM
      # Pinned for the build, not the runtime: a static service runs Vite on this Node and serves no Node
      # process, so nothing here is exposed to the advisory. It moves with the API because a repo where only one
      # service names its runtime is a repo where the other one silently floats.
      - key: NODE_VERSION
        value: "22.23.4"

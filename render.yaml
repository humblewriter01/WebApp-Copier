services:
  - type: web
    name: telegram-copier-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-copier-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: CLIENT_URL
        value: https://telegram-copier-web.onrender.com
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
  - type: web
    name: telegram-copier-web
    runtime: static
    plan: free
    region: oregon
    branch: main
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://telegram-copier-api.onrender.com
databases:
  - name: telegram-copier-db
    databaseName: telegram_signal_desk
    user: telegram_signal_desk
    plan: free
    region: oregon
